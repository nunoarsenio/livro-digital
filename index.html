<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Livro Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --ink:#1C2733; --muted:#5B6878; --page:#FFFFFF; --side:#EEF2F7; --line:#D6DDE7;
  --blue:#1F4E8C; --on-blue:#FFFFFF; --margin:#D9534F; --hl:#FFE873; --hl-soft:#FFF6BF;
  --hover:rgba(31,78,140,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#DCE3EC; --muted:#93A0B0; --page:#18202A; --side:#11171F; --line:#2A3542;
    --blue:#8DB4EA; --on-blue:#10161E; --margin:#C2595A; --hl:#E8CF52; --hl-soft:rgba(232,207,82,.16);
    --hover:rgba(141,180,234,.1);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#DCE3EC; --muted:#93A0B0; --page:#18202A; --side:#11171F; --line:#2A3542;
  --blue:#8DB4EA; --on-blue:#10161E; --margin:#C2595A; --hl:#E8CF52; --hl-soft:rgba(232,207,82,.16);
  --hover:rgba(141,180,234,.1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--side);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--side);color:var(--ink);font-family:var(--ui);font-size:16px;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button{font-family:inherit}

.app{display:grid;grid-template-columns:19rem 1fr;grid-template-rows:1fr;height:100%}
.top{display:none}

/* Índice */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:1.3rem 1.1rem .8rem;display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
#bookHead{flex:1;min-width:0}
.book{font:600 1.2rem/1.3 var(--read);margin:0}
.book-in{width:100%;font:600 1.1rem/1.3 var(--read);color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem}
.search{padding:0 1.1rem .8rem}
.search input{width:100%;padding:.55rem .75rem;border:1px solid var(--line);border-radius:6px;background:var(--page);color:var(--ink);font:inherit;font-size:.92rem}
#tree{flex:1;overflow:auto;padding:.2rem .6rem 1rem}
.tree,.subs,.results{list-style:none;margin:0;padding:0}
.t{margin-bottom:.15rem}
.row{display:flex;align-items:center;gap:.1rem;border-radius:6px}
.row a{flex:1;display:flex;gap:.5rem;align-items:baseline;padding:.45rem .5rem;color:var(--ink);text-decoration:none;font-size:.95rem;line-height:1.35;border-radius:6px;min-width:0}
.row a:hover{background:var(--hover)}
.t>.row a{font-weight:600}
.row.cur a{background:var(--hl-soft);font-weight:700}
.n{color:var(--margin);font-variant-numeric:tabular-nums;font-weight:600;min-width:1.5rem;flex:none}
.subs .n{min-width:2.1rem}
.tt{overflow-wrap:anywhere}
.exp,.exp-sp{width:1.6rem;height:1.6rem;flex:none}
.exp{border:0;background:none;color:var(--muted);border-radius:4px;display:grid;place-items:center;cursor:pointer;padding:0}
.exp:hover{background:var(--hover);color:var(--ink)}
.exp svg{transition:transform .15s ease}
.t.open>.row .exp svg{transform:rotate(90deg)}
.subs{display:none;padding-left:1.7rem}
.t.open>.subs{display:block}
.subs .row a{font-size:.92rem;font-weight:400}
.tools{display:flex;gap:1px;flex:none}
.tools button{width:1.6rem;height:1.6rem;border:0;background:none;color:var(--muted);border-radius:4px;display:grid;place-items:center;cursor:pointer;padding:0}
.tools button:hover{background:var(--hover);color:var(--ink)}
.tools .del:hover{color:var(--margin)}
.add{border:0;background:none;color:var(--blue);font:500 .88rem var(--ui);padding:.4rem .5rem;cursor:pointer;border-radius:6px}
.add:hover{background:var(--hover)}
.add-topic{margin:.4rem 0 0 1.7rem}
.res a{display:block;padding:.55rem .6rem;border-radius:6px;text-decoration:none;color:var(--ink)}
.res a:hover{background:var(--hover)}
.rt{display:flex;gap:.4rem;font-weight:600;font-size:.92rem}
.sn{display:block;margin-top:.2rem;font-size:.84rem;line-height:1.45;color:var(--muted)}
mark{background:var(--hl);color:#1C2733;border-radius:2px;padding:0 .1em}
.noresult{padding:.6rem;color:var(--muted);font-size:.9rem;margin:0}
.side-foot{padding:.8rem 1.1rem 1rem;border-top:1px solid var(--line);display:flex;gap:.5rem;flex-wrap:wrap}
.side-foot:empty{display:none}
.side-foot{flex-direction:column;align-items:stretch}
.pub{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.pub-st{font-size:.85rem;color:var(--muted)}
.pub-st.warn{color:var(--ink);font-weight:600}
.more{display:flex;flex-wrap:wrap;gap:.4rem}
.btn:disabled{opacity:.45;cursor:default}

.btn{font:600 .88rem var(--ui);padding:.5rem .85rem;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:var(--on-blue);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--margin);border-color:var(--margin);color:#fff}
.btn.sm{padding:.4rem .7rem;font-size:.84rem}

/* Página */
.main{overflow:auto;background:var(--page);min-height:0}
.sheet{position:relative;max-width:50rem;min-height:100%;padding:3rem 3rem 5rem 5rem}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:3.4rem;width:2px;background:var(--margin);opacity:.5}
.crumb{font-size:.88rem;color:var(--muted);margin-bottom:.7rem;min-height:1.3em}
.crumb a{color:var(--muted);text-underline-offset:2px}
.ttl{position:relative;font:700 2.1rem/1.2 var(--read);margin:0 0 1.6rem;letter-spacing:-.01em;text-wrap:balance}
.ttl .num{position:absolute;right:calc(100% + 2.1rem);top:.6rem;font:700 .9rem var(--ui);color:var(--margin);white-space:nowrap;letter-spacing:0}
.content{font:400 1.12rem/1.75 var(--read);max-width:38em;overflow-wrap:break-word}
.content h2{font:700 1.4rem/1.3 var(--read);margin:2.2rem 0 .7rem}
.content h3{font:600 1.15rem/1.35 var(--read);margin:1.8rem 0 .5rem}
.content h4{font:600 1.05rem/1.4 var(--read);margin:1.5rem 0 .4rem}
.content>:first-child{margin-top:0}
.content p{margin:0 0 1.05rem}
.content ul,.content ol{margin:0 0 1.1rem;padding-left:1.4rem}
.content li{margin:.3rem 0}
.content blockquote{margin:1.4rem 0;padding:0 0 0 1.1rem;border-left:3px solid var(--line);color:var(--muted);font-style:italic}
.content .nota{background:var(--hl-soft);padding:1rem 1.2rem;margin:1.4rem 0;border-radius:3px}
.content .nota p:last-child{margin-bottom:0}
.content img{max-width:100%;height:auto;border-radius:4px;display:block;margin:1.2rem 0}
.content a{color:var(--blue);text-underline-offset:2px}
.content table{border-collapse:collapse;margin:0 0 1.2rem;display:block;overflow-x:auto;max-width:100%}
.content td,.content th{border:1px solid var(--line);padding:.4rem .6rem;font-size:.98rem}
.vazio{color:var(--muted);font-style:italic}
.inthis{margin-top:2.4rem;max-width:38em}
.inthis h2{font:600 .95rem var(--ui);color:var(--muted);margin:0 0 .6rem}
.inthis ol{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.inthis a{display:flex;gap:.8rem;align-items:baseline;padding:.75rem 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font:500 1.05rem/1.4 var(--read)}
.inthis a:hover{color:var(--blue)}
.inthis .n{font-family:var(--ui);font-size:.9rem;min-width:2.2rem}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3.5rem;max-width:38em;padding-top:1.2rem;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:.2rem;text-decoration:none;max-width:48%;padding:.3rem .2rem;border-radius:6px}
.pager .next{text-align:right;margin-left:auto}
.pager small{color:var(--muted);font-size:.82rem}
.pager span{font:600 1rem/1.35 var(--read);color:var(--blue)}
.pager a:hover span{text-decoration:underline;text-underline-offset:2px}

/* Edição */
.ttl-in{width:100%;font:inherit;letter-spacing:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--line);padding:.1rem 0 .3rem;margin:0}
.ttl-in:focus{outline:none;border-bottom:1px solid var(--blue)}
.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:.2rem;padding:.4rem;background:var(--side);border:1px solid var(--line);border-radius:8px;margin:0 0 1.3rem;max-width:38em}
.toolbar button{font:500 .85rem var(--ui);border:0;background:transparent;color:var(--ink);padding:.4rem .55rem;border-radius:5px;cursor:pointer}
.toolbar button:hover{background:var(--hover)}
.sep{width:1px;background:var(--line);margin:.25rem .15rem}
.editor{min-height:50vh;outline:none;padding:.2rem 0;caret-color:var(--blue)}
.editor:empty::before{content:attr(data-ph);color:var(--muted);font-style:italic}
.editor img{cursor:pointer}
.editor img.sel{outline:3px solid var(--blue);outline-offset:2px}
.imgbar{position:absolute;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:.2rem;max-width:calc(100% - 1rem);padding:.3rem;background:var(--page);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);font:500 .82rem var(--ui)}
.imgbar button{border:0;background:transparent;color:var(--ink);padding:.35rem .5rem;border-radius:5px;cursor:pointer;font:inherit}
.imgbar button:hover{background:var(--hover)}
.imgbar button.on{background:var(--hl-soft);font-weight:700}
.imgbar input[type=range]{width:6.5rem;accent-color:var(--blue)}
.imgbar .pct{min-width:2.6rem;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:.2rem}
.imgbar .rm{color:var(--margin)}
.imgh{position:absolute;z-index:6;width:16px;height:16px;background:var(--blue);border:2px solid var(--page);border-radius:3px;cursor:nwse-resize;touch-action:none}
.status{font-size:.82rem;color:var(--muted);margin-top:1.5rem}

.empty{max-width:30rem;padding:5rem 2rem 2rem 5rem}
.empty h1{font:700 1.6rem/1.3 var(--read);margin:0 0 .6rem}
.empty p{color:var(--muted);margin:0 0 1.4rem;line-height:1.5}

/* Diálogo e aviso */
.modal{position:fixed;inset:0;background:rgba(15,20,28,.45);display:grid;place-items:center;z-index:50;padding:1rem}
.dlg{background:var(--page);color:var(--ink);border-radius:10px;width:min(32rem,100%);padding:1.4rem;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h2{font:700 1.15rem/1.3 var(--read);margin:0 0 .5rem}
.dlg p{margin:0 0 1rem;color:var(--muted);font-size:.95rem;line-height:1.45}
.dlg input,.dlg textarea{width:100%;font:inherit;padding:.55rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--side);color:var(--ink);margin:0 0 1rem}
.dlg textarea{height:14rem;font:.8rem/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.acts{display:flex;justify-content:flex-end;gap:.5rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,1rem);background:var(--ink);color:var(--page);padding:.6rem 1rem;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 2rem)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{position:fixed;inset:0;background:rgba(15,20,28,.4);z-index:20}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .top{display:flex;align-items:center;gap:.5rem;padding:.45rem .7rem;background:var(--side);border-bottom:1px solid var(--line);font:600 1rem/1.3 var(--read);min-width:0}
  #topTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon{border:0;background:none;color:var(--ink);width:2.4rem;height:2.4rem;border-radius:6px;display:grid;place-items:center;cursor:pointer;flex:none}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(20rem,86vw);z-index:30;transform:translateX(-105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .sheet{padding:1.8rem 1.2rem 4rem 2.6rem}
  .sheet::before{left:1.4rem}
  .ttl{font-size:1.7rem}
  .ttl .num{position:static;display:block;margin-bottom:.35rem}
  .content{font-size:1.05rem}
  .empty{padding:3rem 1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button id="menuBtn" class="icon" aria-label="Abrir índice"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
    <span id="topTitle"></span>
  </header>
  <aside id="side" class="side" aria-label="Índice do livro">
    <div class="side-head">
      <div id="bookHead"></div>
      <button id="modeBtn" class="btn ghost sm"></button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Pesquisar na matéria" aria-label="Pesquisar na matéria" autocomplete="off"></div>
    <nav id="tree" aria-label="Tópicos"></nav>
    <div id="sideFoot" class="side-foot"></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <main id="main" class="main"></main>
</div>

<div id="modal" class="modal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt"></h2>
    <p id="mp"></p>
    <input id="mi" type="text" aria-labelledby="mt">
    <textarea id="mta" aria-labelledby="mt" spellcheck="false"></textarea>
    <div class="acts"><button id="mcancel" class="btn ghost"></button><button id="mok" class="btn"></button></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="file" type="file" accept="image/*" hidden>

<script src="MicrosoftTeams.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = 'livro-digital-v1';
const uid = () => 'p' + Math.random().toString(36).slice(2, 9);
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const plain = html => (new DOMParser().parseFromString(html || '', 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim();

const CHEV = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>';
const UP = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V2M2.5 5.5 6 2l3.5 3.5"/></svg>';
const DOWN = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v8M2.5 6.5 6 10l3.5-3.5"/></svg>';
const XI = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m3 3 6 6M9 3l-6 6"/></svg>';

/* ---------- Limpeza do HTML (colagens do Word, importações) ---------- */
const ALLOW = new Set(['P','H2','H3','H4','UL','OL','LI','B','STRONG','I','EM','U','A','BR','BLOCKQUOTE','IMG','TABLE','THEAD','TBODY','TR','TD','TH','DIV','SUB','SUP','MARK']);
const DROP = new Set(['SCRIPT','STYLE','META','LINK','TITLE','IFRAME','OBJECT','EMBED','SVG','MATH','TEMPLATE','NOSCRIPT','FORM','INPUT','BUTTON','SELECT','TEXTAREA','VIDEO','AUDIO']);
function walk(node){
  [...node.childNodes].forEach(ch => {
    if (ch.nodeType === 8) { ch.remove(); return; }
    if (ch.nodeType !== 1) return;
    const tag = ch.tagName;
    if (DROP.has(tag)) { ch.remove(); return; }
    walk(ch);
    if (tag === 'H1') { const n = ch.ownerDocument.createElement('h2'); n.append(...ch.childNodes); ch.replaceWith(n); return; }
    if (!ALLOW.has(tag)) { ch.replaceWith(...ch.childNodes); return; }
    [...ch.attributes].forEach(a => {
      const n = a.name, v = a.value;
      const keep = (tag === 'A' && n === 'href' && /^(https?:|mailto:|#)/i.test(v))
        || (tag === 'IMG' && n === 'src' && /^data:image\//i.test(v))
        || (tag === 'IMG' && n === 'alt')
        || (tag === 'IMG' && n === 'style' && /^\s*width:\s*\d{1,3}(\.\d+)?%;?\s*$/i.test(v))
        || (tag === 'DIV' && n === 'class' && v === 'nota')
        || ((tag === 'TD' || tag === 'TH') && (n === 'colspan' || n === 'rowspan'));
      if (!keep) ch.removeAttribute(n);
    });
    if (tag === 'IMG' && !ch.getAttribute('src')) { ch.remove(); return; }
    if (tag === 'A') { ch.setAttribute('target', '_blank'); ch.setAttribute('rel', 'noopener'); }
  });
}
function clean(html){ const doc = new DOMParser().parseFromString(html || '', 'text/html'); walk(doc.body); return doc.body.innerHTML; }

const RESERVED = ['settings','sidebar','customize','upgrade','downloads'];
const safeId = id => (typeof id === 'string' && /^[A-Za-z0-9-]{1,40}$/.test(id) && !RESERVED.includes(id) && !id.startsWith('comment-')) ? id : uid();
function normalize(o){
  if (!o || !Array.isArray(o.topics)) throw new Error('formato');
  return {
    title: String(o.title || 'Livro sem título'),
    topics: o.topics.map(t => ({
      id: safeId(t.id), title: String(t.title || ''), html: clean(String(t.html || '')),
      subs: (Array.isArray(t.subs) ? t.subs : []).map(s => ({ id: safeId(s.id), title: String(s.title || ''), html: clean(String(s.html || '')) }))
    }))
  };
}

/* ---------- Estado, rascunho e publicação ---------- */
const DRAFT = 'livro-rascunho-v1', TOKEN = 'livro-github-chave';
let book = { title: 'Livro Digital', topics: [] };
let cur = null, mode = 'read', q = '', edRef = null, saveTimer = null, pendingRange = null, wantTitleFocus = false;
let dirty = false, pending = false, loading = true, loadError = false, inTeams = false, canEdit = true, publishing = false;
const open = new Set();

/* Onde está o repositório: deduzido do endereço do GitHub Pages */
const GH = (() => {
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  if (!m) return null;
  const seg = location.pathname.split('/').filter(Boolean);
  const repo = seg.length && !/\.html?$/i.test(seg[0]) ? seg[0] : `${m[1]}.github.io`;
  return { owner: m[1], repo };
})();
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

function save(){
  dirty = true;
  if (!lsSet(DRAFT, JSON.stringify(book))) toast('O rascunho não coube no armazenamento deste dispositivo. Publica já para não perder alterações.');
  updatePub();
  return true;
}
function flush(){
  if (edRef && edRef.dirty) { edRef.node.html = clean(edRef.el.innerHTML); edRef.dirty = false; pending = true; }
  if (pending) { pending = false; return save(); }
  return true;
}
function flushNow(){ clearTimeout(saveTimer); flush(); }
function setStatus(t){ const s = $('#st'); if (s) s.textContent = t; }
function saveSoon(){ pending = true; clearTimeout(saveTimer); setStatus('A guardar rascunho…'); saveTimer = setTimeout(() => { flush(); setStatus('Rascunho guardado neste dispositivo. Publica para os alunos verem.'); }, 400); }

async function loadBook(){
  let published = null;
  try {
    const r = await fetch('livro.json?v=' + Date.now(), { cache: 'no-store' });
    if (r.ok) published = normalize(await r.json());
    else if (r.status !== 404) loadError = true;
  } catch (e) { loadError = true; }
  const draft = canEdit ? lsGet(DRAFT) : null;
  if (draft) { try { book = normalize(JSON.parse(draft)); dirty = true; loadError = false; } catch (e) { lsDel(DRAFT); } }
  if (!dirty && published) book = published;
  loading = false;
}

function b64(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function gh(path, opts = {}){
  return fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}${path}`, {
    ...opts,
    headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + lsGet(TOKEN), 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }
  });
}
async function setupToken(){
  const v = await ask({ title: 'Ligar ao GitHub', password: true, input: '', ok: 'Guardar chave',
    text: `Cola aqui a chave de acesso do GitHub (token) com permissão de escrita em «Contents» no repositório ${GH.owner}/${GH.repo}. Fica guardada apenas neste dispositivo.` });
  if (!v || !v.trim()) return false;
  lsSet(TOKEN, v.trim());
  try {
    const r = await gh('');
    if (!r.ok) throw 0;
    toast('Chave guardada.'); renderFoot(); return true;
  } catch (e) {
    lsDel(TOKEN); toast('A chave não dá acesso a este repositório. Confirma que a criaste para ' + GH.repo + '.'); return false;
  }
}
async function publish(){
  if (publishing) return;
  if (!GH) { toast('A publicação só funciona com a app alojada no GitHub Pages.'); return; }
  if (!lsGet(TOKEN) && !(await setupToken())) return;
  flushNow(); publishing = true; renderFoot();
  try {
    let sha;
    const g = await gh('/contents/livro.json');
    if (g.status === 401 || g.status === 403) throw { auth: true };
    if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw 0;
    const p = await gh('/contents/livro.json', { method: 'PUT', body: JSON.stringify({ message: 'Atualizar matéria do Livro Digital', content: b64(JSON.stringify(book, null, 1)), sha }) });
    if (p.status === 401 || p.status === 403) throw { auth: true };
    if (!p.ok) throw 0;
    dirty = false; lsDel(DRAFT);
    toast('Publicado. Os alunos veem as alterações dentro de 1 a 2 minutos.');
  } catch (e) {
    if (e && e.auth) { lsDel(TOKEN); toast('A chave do GitHub expirou ou não tem permissão de escrita. Publica de novo para a configurar.'); }
    else toast('Não foi possível publicar. Verifica a ligação à internet e tenta outra vez.');
  }
  publishing = false; renderFoot();
}
async function discardDraft(){
  const ok = await ask({ title: 'Descartar o rascunho?', text: 'As alterações que ainda não publicaste neste dispositivo vão ser apagadas e volta a aparecer a versão publicada.', ok: 'Descartar', danger: true });
  if (!ok) return;
  clearTimeout(saveTimer); edRef = null; pending = false;
  lsDel(DRAFT); dirty = false; loading = true; render();
  await loadBook(); route(); render(); toast('Rascunho descartado.');
}
function updatePub(){ renderFoot(); }

function nodes(){
  const out = [];
  book.topics.forEach((t, i) => {
    out.push({ n: t, t, kind: 't', num: String(i + 1) });
    t.subs.forEach((s, j) => out.push({ n: s, t, kind: 's', num: `${i + 1}.${j + 1}` }));
  });
  return out;
}
const get = id => nodes().find(x => x.n.id === id);
function parentArr(id){
  if (book.topics.some(t => t.id === id)) return book.topics;
  for (const t of book.topics) if (t.subs.some(s => s.id === id)) return t.subs;
  return null;
}

/* ---------- Navegação ---------- */
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  const all = nodes();
  cur = all.some(x => x.n.id === id) ? id : (all[0] ? all[0].n.id : null);
  if (cur) open.add(get(cur).t.id);
}
function go(id){
  flushNow(); closeDrawer();
  if (location.hash.slice(1) === id) { route(); render(); } else location.hash = id;
}
window.addEventListener('hashchange', () => { flushNow(); route(); render(); $('#main').scrollTop = 0; closeDrawer(); });

/* ---------- Desenho ---------- */
function render(){ renderHead(); renderTree(); renderFoot(); renderMain(); }

function syncTitles(){ document.title = book.title || 'Livro Digital'; $('#topTitle').textContent = book.title; }

const tools = id => `<span class="tools"><button data-up="${id}" aria-label="Mover para cima" title="Mover para cima">${UP}</button><button data-down="${id}" aria-label="Mover para baixo" title="Mover para baixo">${DOWN}</button><button class="del" data-del="${id}" aria-label="Eliminar" title="Eliminar">${XI}</button></span>`;
const label = n => esc(n.title) || 'Sem título';

function renderTree(){
  const tree = $('#tree');
  if (loading) { tree.innerHTML = ''; return; }
  if (q.trim()) return renderResults();
  const edit = mode === 'edit';
  if (!book.topics.length) {
    tree.innerHTML = edit ? '<button class="add" data-addtopic>+ Novo tópico</button>' : '<p class="noresult">Ainda não há tópicos.</p>';
    return;
  }
  let h = '<ol class="tree">';
  book.topics.forEach((t, i) => {
    const isOpen = edit || open.has(t.id);
    const ac = cur === t.id ? ' aria-current="page"' : '';
    h += `<li class="t${isOpen ? ' open' : ''}"><div class="row${cur === t.id ? ' cur' : ''}">`;
    h += (t.subs.length && !edit) ? `<button class="exp" data-exp="${t.id}" aria-expanded="${isOpen}" aria-label="${isOpen ? 'Esconder' : 'Mostrar'} subtópicos">${CHEV}</button>` : '<span class="exp-sp"></span>';
    h += `<a href="#${t.id}"${ac}><span class="n">${i + 1}</span><span class="tt">${label(t)}</span></a>${edit ? tools(t.id) : ''}</div>`;
    if (t.subs.length || edit) {
      h += '<ol class="subs">';
      t.subs.forEach((s, j) => {
        const sc = cur === s.id ? ' aria-current="page"' : '';
        h += `<li><div class="row${cur === s.id ? ' cur' : ''}"><a href="#${s.id}"${sc}><span class="n">${i + 1}.${j + 1}</span><span class="tt">${label(s)}</span></a>${edit ? tools(s.id) : ''}</div></li>`;
      });
      if (edit) h += `<li><button class="add" data-addsub="${t.id}">+ Subtópico</button></li>`;
      h += '</ol>';
    }
    h += '</li>';
  });
  h += '</ol>';
  if (edit) h += '<button class="add add-topic" data-addtopic>+ Novo tópico</button>';
  tree.innerHTML = h;
}

function hlt(str, nq){
  const i = norm(str).indexOf(nq);
  if (i < 0 || !nq) return esc(str);
  return esc(str.slice(0, i)) + '<mark>' + esc(str.slice(i, i + nq.length)) + '</mark>' + esc(str.slice(i + nq.length));
}
function renderResults(){
  const nq = norm(q.trim()), res = [];
  nodes().forEach(x => {
    const title = x.n.title || '', text = plain(x.n.html);
    const ix = norm(text).indexOf(nq);
    if (norm(title).includes(nq) || ix >= 0) res.push({ x, title, text, ix });
  });
  const tree = $('#tree');
  if (!res.length) { tree.innerHTML = `<p class="noresult">Nada encontrado para «${esc(q.trim())}».</p>`; return; }
  tree.innerHTML = '<ol class="results">' + res.map(r => {
    let sn = '';
    if (r.ix < 0) { const s = r.text.slice(0, 90); if (s) sn = esc(s) + (r.text.length > 90 ? '…' : ''); }
    else {
      const st = Math.max(0, r.ix - 40), en = Math.min(r.text.length, r.ix + nq.length + 60);
      sn = (st > 0 ? '…' : '') + hlt(r.text.slice(st, en), nq) + (en < r.text.length ? '…' : '');
    }
    return `<li class="res"><a href="#${r.x.n.id}"><span class="rt"><span class="n">${r.x.num}</span><span>${hlt(r.title || 'Sem título', nq)}</span></span>${sn ? `<span class="sn">${sn}</span>` : ''}</a></li>`;
  }).join('') + '</ol>';
}

  const f = $('#sideFoot');
  if (!canEdit || (mode !== 'edit' && !dirty)) { f.innerHTML = ''; return; }
  let h = `<div class="pub"><span class="pub-st${dirty ? ' warn' : ''}">${publishing ? 'A publicar…' : dirty ? 'Alterações por publicar' : 'Tudo publicado'}</span><button class="btn sm" id="pubBtn"${dirty && !publishing ? '' : ' disabled'}>Publicar</button></div>`;

    h += '<div class="more"><button class="btn ghost sm" id="expBtn">Exportar</button><button class="btn ghost sm" id="impBtn">Importar</button>';
    if (dirty) h += '<button class="btn ghost sm" id="disBtn">Descartar rascunho</button>';
    if (lsGet(TOKEN)) h += '<button class="btn ghost sm" id="tokBtn">Desligar GitHub</button>';
    h += '</div>';
  }
  f.innerHTML = h;
  $('#pubBtn').onclick = publish;

const TB = [['h2','Título','Título de secção'],['h3','Subtítulo','Subtítulo'],['p','Texto','Parágrafo normal'],0,
  ['bold','<b>N</b>','Negrito'],['italic','<i>I</i>','Itálico'],['underline','<u>S</u>','Sublinhado'],0,

  ['link','Ligação','Inserir ligação'],['img','Imagem','Inserir imagem'],['clear','Limpar','Limpar formatação']];
const TOOLBAR = TB.map(b => b ? `<button type="button" data-cmd="${b[0]}" title="${b[2]}" aria-label="${b[2]}">${b[1]}</button>` : '<span class="sep" aria-hidden="true"></span>').join('');

function renderMain(){
  const m = $('#main');
  edRef = null; selImg = null;
  if (loading) { m.innerHTML = '<div class="empty"><p>A carregar a matéria…</p></div>'; return; }
  if (!cur && loadError) { m.innerHTML = '<div class="empty"><h1>Não foi possível carregar a matéria.</h1><p>Verifica a ligação à internet e volta a abrir o separador.</p></div>'; return; }
  if (!cur) {
    m.innerHTML = canEdit
      ? `<div class="empty"><h1>Este livro ainda não tem matéria.</h1><p>Cria o primeiro tópico para começar a escrever.</p><button class="btn" id="firstBtn">Criar o primeiro tópico</button></div>`
      : '<div class="empty"><h1>Este livro ainda não tem matéria.</h1><p>Volta mais tarde.</p></div>';
    if ($('#firstBtn')) $('#firstBtn').onclick = () => { mode = 'edit'; addTopic(); };
    return;
  }
  const x = get(cur), all = nodes(), i = all.findIndex(y => y.n.id === cur);
  const crumb = x.kind === 's' ? `<a href="#${x.t.id}">${x.num.split('.')[0]}. ${label(x.t)}</a>` : esc(book.title);

    m.innerHTML = `<div class="sheet"><nav class="crumb">${crumb}</nav>
      <div class="ttl"><span class="num">${x.num}</span><input id="ti" class="ttl-in" value="${esc(x.n.title)}" placeholder="Título ${x.kind === 't' ? 'do tópico' : 'do subtópico'}" aria-label="Título"></div>
      <div class="toolbar" role="toolbar" aria-label="Formatação">${TOOLBAR}</div>
      <div id="ed" class="content editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Conteúdo" data-ph="Escreve aqui a matéria…">${x.n.html}</div>
      <p class="status" id="st">As alterações são guardadas automaticamente.</p></div>`;
    bindEditor(x);

  let body = x.n.html;
  if (!plain(body) && !/<img/i.test(body)) body = (x.kind === 't' && x.n.subs.length) ? '' : '<p class="vazio">Ainda sem conteúdo.</p>';
  const inthis = (x.kind === 't' && x.n.subs.length)
    ? `<section class="inthis"><h2>Neste tópico</h2><ol>${x.n.subs.map((s, j) => `<li><a href="#${s.id}"><span class="n">${x.num}.${j + 1}</span><span>${label(s)}</span></a></li>`).join('')}</ol></section>` : '';
  const prev = all[i - 1], next = all[i + 1];
  const pager = `<nav class="pager" aria-label="Páginas">${prev ? `<a class="prev" href="#${prev.n.id}"><small>Anterior</small><span>${prev.num} ${label(prev.n)}</span></a>` : ''}${next ? `<a class="next" href="#${next.n.id}"><small>Seguinte</small><span>${next.num} ${label(next.n)}</span></a>` : ''}</nav>`;
  m.innerHTML = `<article class="sheet"><nav class="crumb">${crumb}</nav><h1 class="ttl"><span class="num">${x.num}</span>${label(x.n)}</h1><div class="content">${body}</div>${inthis}${pager}</article>`;
}

/* ---------- Editor ---------- */
function ensureSel(ed){
  const sel = getSelection();
  if (!sel.rangeCount || !ed.contains(sel.anchorNode)) {
    ed.focus();
    const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false);
    sel.removeAllRanges(); sel.addRange(r);
  }
}
function restore(ed, r){ ed.focus(); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

function bindEditor(x){
  const ed = $('#ed');
  edRef = { el: ed, node: x.n, dirty: false };
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
  ed.addEventListener('input', () => { edRef.dirty = true; saveSoon(); if (selImg && !ed.contains(selImg)) deselectImg(); else placeImgUi(); });
  ed.addEventListener('click', e => { if (e.target.tagName === 'IMG') selectImg(e.target); else deselectImg(); });
  ed.addEventListener('paste', e => {
    e.preventDefault();
    const cd = e.clipboardData, html = cd.getData('text/html');
    let out;
    if (html) out = clean(html);
    else {
      const t = cd.getData('text/plain');
      out = /\n/.test(t) ? t.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('') : esc(t);
    }
    document.execCommand('insertHTML', false, out);
  });
  ed.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) { e.preventDefault(); pendingRange = null; insertImage(f); }
  });
  $('#ti').addEventListener('input', e => { x.n.title = e.target.value; saveSoon(); renderTree(); });
  const tb = $('.toolbar');
  tb.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  tb.addEventListener('click', e => { const b = e.target.closest('button'); if (b) cmd(b.dataset.cmd); });
}

async function cmd(c){
  const ed = $('#ed'); if (!ed) return;
  ensureSel(ed);
  const ex = (a, v) => document.execCommand(a, false, v);
  switch (c) {
    case 'h2': case 'h3': case 'p': ex('formatBlock', `<${c}>`); break;
    case 'quote': ex('formatBlock', '<blockquote>'); break;
    case 'bold': case 'italic': case 'underline': ex(c); break;
    case 'ul': ex('insertUnorderedList'); break;
    case 'ol': ex('insertOrderedList'); break;
    case 'nota': ex('insertHTML', '<div class="nota"><p>Escreve aqui a nota.</p></div><p><br></p>'); break;
    case 'clear': ex('removeFormat'); ex('unlink'); break;
    case 'link': {
      const r = getSelection().getRangeAt(0).cloneRange(), txt = r.toString();
      const url = await ask({ title: 'Inserir ligação', text: txt ? `A ligação fica no texto «${txt.slice(0, 60)}».` : 'Indica o endereço da ligação.', input: 'https://', ok: 'Inserir' });
      if (!url) { restore(ed, r); return; }
      const u = url.trim();
      if (!/^(https?:\/\/.+|mailto:.+)/i.test(u)) { restore(ed, r); toast('O endereço tem de começar por https:// ou http://'); return; }
      restore(ed, r);
      if (txt) ex('createLink', u); else ex('insertHTML', `<a href="${esc(u)}">${esc(u)}</a>`);
      break;
    }
    case 'img': {
      pendingRange = getSelection().getRangeAt(0).cloneRange();
      $('#file').value = ''; $('#file').click();
      return;
    }
  }
  edRef.dirty = true; saveSoon();
}

/* ---------- Redimensionar imagens ---------- */
let selImg = null;
function imgPct(img){
  const m = (img.style.width || '').match(/([\d.]+)%/);
  if (m) return Math.round(+m[1]);
  const ed = $('#ed');
  return Math.max(10, Math.min(100, Math.round(img.getBoundingClientRect().width / ed.clientWidth * 100)));
}
function setImgPct(img, p){
  img.style.width = Math.max(10, Math.min(100, Math.round(p))) + '%';
  img.removeAttribute('width'); img.removeAttribute('height');
  if (edRef) { edRef.dirty = true; saveSoon(); }
  placeImgUi();
}
function selectImg(img){
  if (selImg && selImg !== img) selImg.classList.remove('sel');
  selImg = img; img.classList.add('sel');
  const sheet = $('.sheet');
  if (!$('#imgbar')) {
    const b = document.createElement('div');
    b.id = 'imgbar'; b.className = 'imgbar'; b.setAttribute('role', 'toolbar'); b.setAttribute('aria-label', 'Tamanho da imagem');
    b.innerHTML = [25, 50, 75, 100].map(p => `<button type="button" data-p="${p}">${p}%</button>`).join('')
      + '<input type="range" min="10" max="100" step="1" aria-label="Largura da imagem"><span class="pct"></span><button type="button" class="rm" data-rm>Remover</button>';
    sheet.appendChild(b);
    b.addEventListener('mousedown', e => { if (e.target.tagName === 'BUTTON') e.preventDefault(); });
    b.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t || !selImg) return;
      if ('rm' in t.dataset) { const img = selImg; deselectImg(); img.remove(); edRef.dirty = true; saveSoon(); return; }
      setImgPct(selImg, +t.dataset.p);
    });
    b.querySelector('input').addEventListener('input', e => { if (selImg) setImgPct(selImg, +e.target.value); });
    const h = document.createElement('div');
    h.id = 'imgh'; h.className = 'imgh'; h.title = 'Arrasta para redimensionar';
    sheet.appendChild(h);
    h.addEventListener('pointerdown', startImgDrag);
  }
  placeImgUi();
}
function deselectImg(){
  if (selImg) selImg.classList.remove('sel');
  selImg = null;
  ['#imgbar', '#imgh'].forEach(id => { const el = $(id); if (el) el.remove(); });
}
function placeImgUi(){
  const b = $('#imgbar'), h = $('#imgh'), sheet = $('.sheet');
  if (!b || !h || !selImg || !sheet) return;
  const sr = sheet.getBoundingClientRect(), ir = selImg.getBoundingClientRect();
  b.style.left = Math.max(0, ir.left - sr.left) + 'px';
  b.style.top = Math.max(0, ir.top - sr.top - b.offsetHeight - 8) + 'px';
  h.style.left = (ir.right - sr.left - 9) + 'px';
  h.style.top = (ir.bottom - sr.top - 9) + 'px';
  const p = imgPct(selImg);
  b.querySelector('input').value = p;
  b.querySelector('.pct').textContent = p + '%';
  b.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('on', +x.dataset.p === p));
}
function startImgDrag(e){
  if (!selImg) return;
  e.preventDefault();
  const h = e.currentTarget, ed = $('#ed');
  const x0 = e.clientX, w0 = selImg.getBoundingClientRect().width, W = ed.clientWidth;
  h.setPointerCapture(e.pointerId);
  const mv = ev => { selImg.style.width = Math.max(10, Math.min(100, Math.round((w0 + ev.clientX - x0) / W * 100))) + '%'; placeImgUi(); };
  const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); edRef.dirty = true; saveSoon(); };
  h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
}
window.addEventListener('resize', placeImgUi);

function readImg(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, 1200 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.82));
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
async function insertImage(f){
  try {
    const data = await readImg(f);
    const ed = $('#ed'); if (!ed) return;
    if (pendingRange) restore(ed, pendingRange); else ensureSel(ed);
    document.execCommand('insertHTML', false, `<img src="${data}" alt="">`);
    edRef.dirty = true; saveSoon();
    const added = [...ed.querySelectorAll('img')].find(i => i.src === data);
    if (added) (added.complete ? selectImg(added) : added.addEventListener('load', () => selectImg(added), { once: true }));
  } catch (e) { toast('Não foi possível ler a imagem. Experimenta um ficheiro JPG ou PNG.'); }
}
$('#file').addEventListener('change', () => {
  const f = $('#file').files[0]; if (!f) return;
  if (!f.type.startsWith('image/')) { toast('Escolhe um ficheiro de imagem.'); return; }
  insertImage(f);
});

/* ---------- Ações sobre tópicos ---------- */
function addTopic(){
  flushNow();
  const t = { id: uid(), title: 'Novo tópico', html: '', subs: [] };
  book.topics.push(t); save(); mode = 'edit'; wantTitleFocus = true; go(t.id);
}
function addSub(tid){
  flushNow();
  const t = book.topics.find(t => t.id === tid); if (!t) return;
  const s = { id: uid(), title: 'Novo subtópico', html: '' };
  t.subs.push(s); open.add(tid); save(); wantTitleFocus = true; go(s.id);
}
function move(id, dir){
  flushNow();
  const a = parentArr(id); if (!a) return;
  const i = a.findIndex(o => o.id === id), j = i + dir;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  save(); renderTree(); renderMain();
  const b = document.querySelector(`[data-${dir < 0 ? 'up' : 'down'}="${id}"]`); if (b) b.focus();
}
async function del(id){
  const x = get(id); if (!x) return;
  const isT = x.kind === 't', ns = isT ? x.n.subs.length : 0;
  const text = isT
    ? (ns ? `O tópico e ${ns === 1 ? 'o seu subtópico' : `os seus ${ns} subtópicos`} vão ser eliminados. Esta ação não pode ser anulada.` : 'O tópico vai ser eliminado. Esta ação não pode ser anulada.')
    : 'O subtópico vai ser eliminado. Esta ação não pode ser anulada.';
  const ok = await ask({ title: `Eliminar «${x.n.title || 'Sem título'}»?`, text, ok: 'Eliminar', danger: true });
  if (!ok) return;
  flushNow();
  const idx = nodes().findIndex(y => y.n.id === id);
  const hitCur = cur === id || (isT && x.n.subs.some(s => s.id === cur));
  const a = parentArr(id); a.splice(a.findIndex(o => o.id === id), 1);
  edRef = null; save();
  if (hitCur) { const rest = nodes(); const nx = rest[Math.min(idx, rest.length - 1)]; go(nx ? nx.n.id : ''); }
  else render();
  toast('Eliminado.');
}

$('#tree').addEventListener('click', e => {
  const b = e.target.closest('button,a'); if (!b) return;
  const d = b.dataset;
  if (b.tagName === 'A') { closeDrawer(); return; }
  if (d.exp) { open.has(d.exp) ? open.delete(d.exp) : open.add(d.exp); renderTree(); const nb = document.querySelector(`[data-exp="${d.exp}"]`); if (nb) nb.focus(); return; }
  if (d.up) return move(d.up, -1);
  if (d.down) return move(d.down, 1);
  if (d.del) return del(d.del);
  if (d.addsub) return addSub(d.addsub);
  if ('addtopic' in d) return addTopic();
});

/* ---------- Exportar / importar ---------- */
function exportBook(){
  flushNow();
  ask({ title: 'Exportar livro', text: 'Copia este texto e guarda-o num ficheiro. Serve como cópia de segurança.',
    area: JSON.stringify(book, null, 1), readonly: true, ok: 'Copiar', cancel: 'Fechar',
    onOk: () => {
      const ta = $('#mta'); ta.select(); let c = false;
      try { c = document.execCommand('copy'); } catch (e) {}
      if (c) toast('Livro copiado.');
      else if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => toast('Livro copiado.'), () => toast('Não foi possível copiar automaticamente. Abre de novo e copia o texto à mão.'));
    } });
}
async function importBook(){
  const v = await ask({ title: 'Importar livro', text: 'Cola aqui o texto de um livro exportado. A matéria atual vai ser substituída.', area: '', ok: 'Importar' });
  if (v == null || !v.trim()) return;
  try {
    flushNow(); edRef = null;
    book = normalize(JSON.parse(v)); save(); toast('Livro importado.');
    const f = nodes()[0]; go(f ? f.n.id : '');
  } catch (e) { toast('O texto não é um livro válido. Confirma que copiaste tudo, do início ao fim.'); }
}

/* ---------- Diálogo, aviso, gaveta ---------- */
function ask(o){
  return new Promise(res => {
    const m = $('#modal'), p = $('#mp'), inp = $('#mi'), ta = $('#mta'), ok = $('#mok'), cn = $('#mcancel');
    $('#mt').textContent = o.title;
    p.textContent = o.text || ''; p.hidden = !o.text;
    inp.hidden = o.input == null; ta.hidden = o.area == null;
    inp.type = o.password ? 'password' : 'text';
    if (o.input != null) inp.value = o.input;
    if (o.area != null) { ta.value = o.area; ta.readOnly = !!o.readonly; }
    ok.textContent = o.ok || 'OK'; ok.className = 'btn' + (o.danger ? ' danger' : '');
    cn.textContent = o.cancel || 'Cancelar';
    m.hidden = false;
    const first = o.input != null ? inp : o.area != null ? ta : ok;
    first.focus(); if (o.input != null) inp.select();
    const done = v => { m.hidden = true; ok.onclick = cn.onclick = m.onclick = m.onkeydown = null; res(v); };
    ok.onclick = () => { if (o.onOk) o.onOk(); done(o.input != null ? inp.value : o.area != null ? ta.value : true); };
    cn.onclick = () => done(null);
    m.onclick = e => { if (e.target === m) done(null); };
    m.onkeydown = e => {
      e.stopPropagation();
      if (e.key === 'Escape') { e.preventDefault(); done(null); }
      if (e.key === 'Enter' && e.target === inp) { e.preventDefault(); ok.click(); }
    };
  });
}
let tt;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2800); }
function openDrawer(){ $('#side').classList.add('open'); $('#scrim').hidden = false; }
function closeDrawer(){ $('#side').classList.remove('open'); $('#scrim').hidden = true; }
$('#menuBtn').onclick = openDrawer;
$('#scrim').onclick = closeDrawer;

$('#modeBtn').onclick = () => { flushNow(); mode = mode === 'edit' ? 'read' : 'edit'; render(); };
$('#q').addEventListener('input', e => { q = e.target.value; renderTree(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; q = ''; renderTree(); } });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (mode !== 'read' || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest && e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const all = nodes(), i = all.findIndex(y => y.n.id === cur);
  const t = all[i + (e.key === 'ArrowRight' ? 1 : -1)];
  if (t) { e.preventDefault(); go(t.n.id); }
});
window.addEventListener('beforeunload', flushNow);

function applyTheme(t){ document.documentElement.dataset.theme = (t === 'dark' || t === 'contrast') ? 'dark' : 'light'; }
async function initTeams(){
  if (!window.microsoftTeams) return;
  try {
    await Promise.race([microsoftTeams.app.initialize(), new Promise((_, rej) => setTimeout(() => rej(new Error('fora do Teams')), 2500))]);
    inTeams = true;
    const ctx = await microsoftTeams.app.getContext();
    applyTheme(ctx.app && ctx.app.theme);
    microsoftTeams.app.registerOnThemeChangeHandler(applyTheme);
    const role = ctx.team ? ctx.team.userRole : undefined;
    /* Só os proprietários da equipa veem o modo de edição; publicar exige sempre a chave do GitHub. */
    canEdit = role === undefined || role === null || role === 0;
  } catch (e) { inTeams = false; }
}
(async () => {
  render();
  await initTeams();
  await loadBook();
  route(); render();
})();
</script>
